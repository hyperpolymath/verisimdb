# SPDX-License-Identifier: MPL-2.0
# Manifest for the proven umbrella (schema proven/manifest/v1). Sweep 1 only:
# unit, smoke, build, p2p. Later sweeps add categories centrally.
schema = "proven/manifest/v1"

# ---- Rust core (workspace) ----
[categories.unit.rust]
command = "OPENSSL_NO_VENDOR=1 cargo test --workspace --lib --bins --locked"
[categories.build.rust]
command = "OPENSSL_NO_VENDOR=1 cargo build --workspace --locked"
[categories.smoke.rust.waiver]
reason = "no `smoke` test target yet; sweep 1 tests arrive from proven-tests-and-benches"
until = "2026-12-31"
[categories.p2p.rust.waiver]
reason = "no `p2p` test target yet (Rust core to Elixir seam); sweep 1 tests arrive from proven-tests-and-benches"
until = "2026-12-31"

# ---- Elixir orchestration ----
[categories.unit.elixir]
command = "cd elixir-orchestration && mix deps.get && mix test"
[categories.build.elixir]
command = "cd elixir-orchestration && mix deps.get && mix compile"
[categories.smoke.elixir.waiver]
reason = "no @tag :smoke tests yet; arrive from proven-tests-and-benches"
until = "2026-12-31"
[categories.p2p.elixir.waiver]
reason = "no @tag :p2p tests yet; arrive from proven-tests-and-benches"
until = "2026-12-31"

# ---- Zig FFI (ffi/zig, connectors/clients/zig) ----
[categories.unit.zig.waiver]
reason = "ffi/zig/build.zig still uses the pre-0.15 build API and fails on zig 0.15.2; port tracked as the verisimdb-data #177 fix"
until = "2026-12-31"
[categories.build.zig.waiver]
reason = "same pre-0.15 build.zig failure as unit; fix tracked with verisimdb-data #177"
until = "2026-12-31"
[categories.smoke.zig.waiver]
reason = "no smoke harness for the FFI bridge yet"
until = "2026-12-31"
[categories.p2p.zig.waiver]
reason = "no p2p harness for the FFI bridge yet"
until = "2026-12-31"

# ---- Playground (ReScript, node) ----
[categories.unit.node]
na = "playground is a ReScript demo with no test script; build is covered, behaviour is exercised by the Elixir and Rust suites"
[categories.smoke.node]
na = "playground has no runnable service of its own; smoke is covered by the Rust API smoke test"
[categories.p2p.node]
na = "playground talks to the API over HTTP only; that seam is the Rust p2p test"
[categories.build.node]
command = "cd playground && npm ci && npm run build"

# ---- Shell gates: exercised by their own workflows ----
[categories.unit.shell]
na = "tests/*-gate.sh are CI gates run by their own workflows, not unit tests"
[categories.build.shell]
na = "shell scripts have no build step"
[categories.smoke.shell]
na = "shell scripts have no service to smoke"
[categories.p2p.shell]
na = "shell scripts have no inter-component seam"

# ---- Languages the v0 umbrella cannot run (v0.2 asks: julia, idris2, setup toolchains) ----
[languages.ignore.coq]
reason = "formal/ proofs are checked by coq-build.yml; no runner in umbrella v0"
[languages.ignore.idris2]
reason = "ABI definitions checked by the build-abi recipe; idris2 toolchain not in umbrella v0"
[languages.ignore.julia]
reason = "connectors/clients/julia SDK; julia toolchain not in umbrella v0"
