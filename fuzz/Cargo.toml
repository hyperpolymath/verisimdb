# SPDX-License-Identifier: MPL-2.0
[package]
name = "verisimdb-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
uuid = "1.23"
# NOTE: this harness fuzzes UUID parsing only (see fuzz_targets/fuzz_octad_id.rs);
# it deliberately does NOT depend on verisim-octad. Pulling verisim-octad would
# drag in verisim-tensor -> burn (rust-version 1.92), which the OSS-Fuzz image's
# older nightly cannot build. Keep this crate's dependency surface minimal.

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "fuzz_octad_id"
path = "fuzz_targets/fuzz_octad_id.rs"
test = false
doc = false

[profile.release]
debug = 1
