# SPDX-License-Identifier: MPL-2.0

[package]
name = "verisim-storage"
description = "Pluggable storage backend abstraction for VeriSimDB"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false  # workspace-internal; path deps cannot be published to crates.io

[features]
default = []
# Enable the redb persistent backend (pure Rust, B-tree, ACID, single-file).
redb-backend = ["dep:redb"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
verisim-wal = { path = "../verisim-wal" }

# Optional: redb for persistent on-disk storage (pure Rust, no C/C++)
redb = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
tokio-test = "0.4"
