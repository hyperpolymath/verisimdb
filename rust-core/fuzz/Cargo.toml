# SPDX-License-Identifier: MPL-2.0

# NOTE: package name MUST differ from the top-level fuzz crate (verisimdb-fuzz).
# ClusterFuzzLite builds both fuzz crates in one OSS-Fuzz project; two root
# packages sharing a name collide in the shared cargo target directory, which
# silently no-ops the second build (it "Finished in 0.01s" and produces no
# binary). Distinct names keep their build fingerprints separate.
[package]
name = "verisimdb-rustcore-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.verisim-api]
path = "../verisim-api"

# Keep fuzz packages out of the parent workspace.
[workspace]
members = ["."]

[[bin]]
name = "fuzz_vql_parser"
path = "fuzz_targets/fuzz_vql_parser.rs"
test = false
doc = false
