# SPDX-License-Identifier: MPL-2.0
# cargo-deny configuration for VeriSimDB
# Run: cargo deny check

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Reviewed exceptions. Keep this list minimal, dated, and justified: every
# entry must name the blocking upstream and the condition for its removal.
# An ignore that cargo-deny reports as `advisory-not-detected` is suppressing
# nothing and must be deleted, not left to rot.
#
# Emptied 2026-07-21. The five burn-era entries (RUSTSEC-2024-0436 paste,
# RUSTSEC-2025-0134 rustls-pemfile, RUSTSEC-2025-0141 bincode,
# RUSTSEC-2026-0002 lru, RUSTSEC-2026-0105 core2) were all reported as
# `advisory-not-detected`: the `burn` ML stack is no longer a dependency at all
# (0 burn crates in Cargo.lock). They were suppressing nothing.
#
# NB `.cargo/audit.toml` is NOT a mirror of this list, and that is deliberate.
# cargo-deny walks a feature-aware dependency graph, so it never sees crates
# reachable only through non-default features; cargo-audit reads Cargo.lock
# directly, so it sees every optional dependency. The quick-xml advisories
# (reached only via verisim-graph's opt-in `oxigraph-backend` feature) are
# therefore ignored in audit.toml and absent here — adding them here just
# produces `advisory-not-detected` warnings. See .cargo/audit.toml for the
# justification and the removal condition.
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",  # webpki-root-certs
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
# Workspace path deps appear as wildcards because they have no
# version constraint; that's fine because they only resolve to the
# in-tree crates. External wildcard deps remain forbidden.
wildcards = "deny"
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
