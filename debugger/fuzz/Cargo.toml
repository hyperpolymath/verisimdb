[package]
name = "fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Prevent this from interfering with workspaces (same as fuzz/ and
# rust-core/fuzz — without this, cargo walks up into a parent workspace
# and `cargo check --manifest-path` refuses the package outright).
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.verisimdb-debugger]
path = ".."

[[bin]]
name = "fuzz_main"
path = "fuzz_targets/fuzz_main.rs"
test = false
doc = false
