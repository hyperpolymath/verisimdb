# SPDX-License-Identifier: MPL-2.0
# Dependabot configuration for RSR-compliant repositories
# Covers common ecosystems - remove unused ones for your project

version: 2
updates:
  # GitHub Actions - always include
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 2

  # Rust/Cargo
    ignore:
      # HOLD: github/codeql-action at v4.38.0 (SHA-pinned). v4.38.1 fails
      # GitHub workflow-startup validation estate-wide (nexia-list#100;
      # SHA-form re-bump bypassed versions-scoped ignores - see
      # nexia-list#101/#104). Hold until upstream clears 4.38.1 or a
      # newer release verifies green; revisit deliberately.
      - dependency-name: "github/codeql-action"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
    open-pull-requests-limit: 0

  # Elixir/Mix
  - package-ecosystem: "mix"
    directory: "/elixir-orchestration"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  # Node.js/npm — VQL playground
  - package-ecosystem: "npm"
    directory: "/playground"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
