# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
name: Mirror to Git Forges

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  mirror:
    uses: hyperpolymath/standards/.github/workflows/mirror-reusable.yml@8e48b1caade08a552646adeab66558ac43b4360d
    # Explicit secret passing only (standards#1108 §6b): `secrets: inherit`
    # forwarded every repo/org secret this caller can see, not just the ten
    # the reusable declares. An unpassed secret no-ops that forge's job.
    secrets:
      GITLAB_SSH_KEY: ${{ secrets.GITLAB_SSH_KEY }}
      BITBUCKET_SSH_KEY: ${{ secrets.BITBUCKET_SSH_KEY }}
      CODEBERG_SSH_KEY: ${{ secrets.CODEBERG_SSH_KEY }}
      SourceHut_SSH_KEY: ${{ secrets.SourceHut_SSH_KEY }}
      DISROOT_SSH_KEY: ${{ secrets.DISROOT_SSH_KEY }}
      GITEA_SSH_KEY: ${{ secrets.GITEA_SSH_KEY }}
      RADICLE_KEY: ${{ secrets.RADICLE_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_AGE_RECIPIENT: ${{ secrets.R2_AGE_RECIPIENT }}
