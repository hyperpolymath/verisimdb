# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
name: Secret Scanner

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    uses: hyperpolymath/standards/.github/workflows/secret-scanner-reusable.yml@8e48b1caade08a552646adeab66558ac43b4360d
    # No `secrets: inherit` (standards#1108 §6b): the reusable declares no
    # workflow_call secrets — gitleaks runs as a pinned, checksum-verified
    # local binary under the job's own GITHUB_TOKEN — so inherit bought
    # nothing and leaked every visible secret into the called workflow
    # (CWE-250). `contents: read` is the reusable's whole requirement; the
    # earlier pull-requests:write/actions:read grants belonged to the retired
    # gitleaks-action integration. This also resolves the CodeRabbit finding
    # on PR #318 about this caller: authenticated operation is preserved by
    # the pinned binary + token, not by inheritance.
    permissions:
      contents: read
