# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# Benchmarks — criterion (Rust) + benchee (Elixir), weekly and on demand.
#
# PRs keep the cheap gate they already have (rust-ci `cargo bench --no-run`,
# elixir-ci benchee script parse). This lane is where benchmarks actually
# EXECUTE and produce comparable numbers: criterion saves a CI baseline per
# run and reports change vs the committed baseline in benches/baseline/;
# benchee JSON lands in bench/results/. Results upload as artifacts and the
# summary renders the deltas. There is deliberately no hard perf gate yet:
# shared-runner variance makes a hard threshold a flake generator, and a
# gate that cries wolf gets bypassed — the ratchet path (self-hosted stable
# runner, then a threshold) is recorded in docs/CI-CD.adoc.
name: Benchmarks

on:
  schedule:
    - cron: '7 3 * * 4'  # Weekly, Thursday
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  criterion:
    name: criterion (Rust modalities)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Run modality benchmarks
        run: |
          set -euo pipefail
          # criterion's exit reflects the compare verdict; this lane is
          # report-only (R-4), so record it and continue to the artifacts.
          rc=0
          # Criterion baselines live under target/criterion/<bench>/committed;
          # benches/baseline/ is a committed snapshot of target/criterion —
          # restore it there before the comparison run.
          if [ -d benches/baseline ]; then
            mkdir -p target/criterion
            cp -r benches/baseline/. target/criterion/
            cargo bench --bench modality_benchmarks -- --baseline committed 2>&1 | tee bench-out.txt || rc=$?
          else
            cargo bench --bench modality_benchmarks -- --save-baseline committed 2>&1 | tee bench-out.txt || rc=$?
          fi
          echo "criterion exit: $rc (report-only lane)"
          mkdir -p bench-results-criterion
          cp -r target/criterion bench-results-criterion/
          { echo "## criterion"; echo; echo '```'; tail -n 60 bench-out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: criterion-results
          path: |
            bench-out.txt
            bench-results-criterion

  benchee:
    name: benchee (Elixir orchestration)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: elixir-orchestration
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: "1.17"
          otp-version: "27"
      - name: Cache mix deps
        uses: actions/cache@v6.1.0
        with:
          path: |
            elixir-orchestration/deps
            elixir-orchestration/_build
          key: ${{ runner.os }}-mix-bench-${{ hashFiles('elixir-orchestration/mix.lock') }}
      - run: mix deps.get
      - name: Run every benchee script
        run: |
          set -euo pipefail
          mkdir -p bench/results
          for f in bench/*_bench.exs; do
            echo "== $f =="
            mix run "$f" 2>&1 | tee "bench/results/$(basename "$f" .exs).log"
          done
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: benchee-results
          path: elixir-orchestration/bench/results
