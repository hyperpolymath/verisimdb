# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# Rust CI — test, lint, audit, docs on every push and PR.
#
# Mirrors the .gitlab-ci.yml security/lint/test stages so contributors
# using GitHub get the same checks before merge.
name: rust-ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (all-targets)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --workspace --all-targets --no-deps -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - run: cargo test --workspace --no-fail-fast

  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - run: cargo doc --workspace --no-deps

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2.87.29
        with:
          tool: cargo-deny
      - run: cargo deny check advisories bans licenses sources

  bench-compile:
    name: benchmarks compile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - run: cargo bench --no-run

  coverage:
    name: cargo-llvm-cov (≥60%)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2.87.29
        with:
          tool: cargo-llvm-cov
      - name: Generate lcov report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Enforce minimum coverage
        run: cargo llvm-cov --workspace --summary-only --fail-under-lines 60

  mutants:
    # Mutation testing — runs only on workflow_dispatch + scheduled because
    # full-workspace mutants can take >20 min.  For PRs the recommended
    # invocation is `cargo mutants --in-diff origin/main` which we can wire
    # into a separate pr-mutants.yml once the suite stabilises.
    name: cargo-mutants (on-demand)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@v2.87.29
        with:
          tool: cargo-mutants
      - name: Run mutation tests on core invariant crates
        run: |
          cargo mutants \
            -p verisim-drift \
            -p verisim-normalizer \
            -p verisim-spatial \
            -p verisim-provenance \
            -p verisim-semantic \
            -p verisim-octad \
            --no-shuffle \
            --output mutants-out/
        continue-on-error: true
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: mutants-report
          path: mutants-out/

  fuzz-compile:
    name: fuzz targets compile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        manifest:
          - fuzz/Cargo.toml
          - rust-core/fuzz/Cargo.toml
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Check fuzz manifest
        env:
          MANIFEST: ${{ matrix.manifest }}
        run: cargo check --manifest-path "$MANIFEST"

  test-evidence:
    # proven-tests-and-benches discipline on the native suites: the registry
    # in verification/test-registry.json must agree with the tree, tier
    # claims must be from the closed vocabulary, and actually-proven claims
    # must name a proof artefact. Cheap, and it makes TESTING.adoc's numbers
    # derived rather than declared.
    name: test evidence (proven-tests registry)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/ci/test-evidence.sh

  pr-mutants:
    # Mutation testing on the diff only (TESTING.adoc Tier 2): full runs are
    # the nightly lane's job. Gated by the shared change-detector so the job
    # still REPORTS on non-Rust PRs instead of stranding the check.
    name: cargo-mutants (in-diff)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect relevant changes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: bash scripts/ci/detect-changes.sh '^(rust-core/|Cargo\.|benches/)'
      - if: steps.detect.outputs.relevant == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - if: steps.detect.outputs.relevant == 'true'
        uses: taiki-e/install-action@v2.87.29
        with:
          tool: cargo-mutants
      - name: Mutate only lines changed against the base
        if: steps.detect.outputs.relevant == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff "$BASE_SHA" -- '*.rs' > /tmp/pr.diff
          if [ ! -s /tmp/pr.diff ]; then
            echo "No Rust diff — nothing to mutate."
            exit 0
          fi
          cargo mutants --in-diff /tmp/pr.diff --no-shuffle --output mutants-out/
      - name: Upload mutants report
        # A missed-mutant failure is only diagnosable from the report;
        # always upload it when the mutation step ran.
        if: always() && steps.detect.outputs.relevant == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-mutants-${{ github.run_id }}
          path: mutants-out/
          if-no-files-found: ignore
          retention-days: 14
