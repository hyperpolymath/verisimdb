# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
# This workflow is managed by gh actions-lock.
# Rust CI — test, lint, audit, docs on every push and PR.
#
# Mirrors the .gitlab-ci.yml security/lint/test stages so contributors
# using GitHub get the same checks before merge.
name: rust-ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (all-targets)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2.9.2
      - run: cargo clippy --workspace --all-targets --no-deps -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2.9.2
      - run: cargo test --workspace --no-fail-fast

  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2.9.2
      - run: cargo doc --workspace --no-deps

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check advisories bans licenses sources

  bench-compile:
    name: benchmarks compile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2.9.2
      - run: cargo bench --no-run

  coverage:
    name: cargo-llvm-cov (≥60%)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: swatinem/rust-cache@v2.9.2
      - uses: taiki-e/install-action@v2.86.2
      - name: Generate lcov report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v7.0.0
        with:
          files: lcov.info
          flags: rust
          fail_ci_if_error: false
        continue-on-error: true
      - name: Enforce minimum coverage
        run: cargo llvm-cov --workspace --summary-only --fail-under-lines 60

  mutants:
    # Mutation testing — runs only on workflow_dispatch + scheduled because
    # full-workspace mutants can take >20 min.  For PRs the recommended
    # invocation is `cargo mutants --in-diff origin/main` which we can wire
    # into a separate pr-mutants.yml once the suite stabilises.
    name: cargo-mutants (on-demand)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2.9.2
      - uses: taiki-e/install-action@v2.86.2
        with:
          tool: cargo-mutants
      - name: Run mutation tests on core invariant crates
        run: |
          cargo mutants \
            -p verisim-drift \
            -p verisim-normalizer \
            -p verisim-spatial \
            -p verisim-provenance \
            -p verisim-semantic \
            -p verisim-octad \
            --no-shuffle \
            --output mutants-out/
        continue-on-error: true
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: mutants-report
          path: mutants-out/

  fuzz-compile:
    name: fuzz targets compile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        manifest:
          - fuzz/Cargo.toml
          - rust-core/fuzz/Cargo.toml
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2.9.2
      - run: cargo check --manifest-path ${{ matrix.manifest }}
