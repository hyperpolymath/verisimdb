name: OSSF Scorecard

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write
  security-events: write

jobs:
  scorecard:
    uses: hyperpolymath/standards/.github/workflows/scorecard-reusable.yml@8e48b1caade08a552646adeab66558ac43b4360d
    # The reusable requires all four grants ON THE CALLING JOB: a job-level
    # permissions block REPLACES the workflow-level one, and `actions: read`
    # was missing here, which errors Scorecard's Packaging check.
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write
