name: OSSF Scorecard

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    uses: hyperpolymath/standards/.github/workflows/scorecard-reusable.yml@45108f95e404e8e17896a56596d0db1cc7883c46
    permissions:
      contents: read
      security-events: write
      id-token: write
